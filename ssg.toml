# Site configuration for rustlogs.com, built with `make build`.
# The paths are relative to the repository root.

site_name = "rlg"
site_title = "rlg: near-lock-free structured logging for Rust"
site_description = "rlg (RustLogs) is a structured logging library for Rust: records leave the calling thread through a ring buffer, and a background thread formats them in one of 14 formats and writes them to os_log, journald, a file or stdout."
base_url = "https://rustlogs.com"
language = "en-GB"

content_dir = "_posts"
template_dir = "_layouts"
output_dir = "docs"

# Agentic discovery: /agents.txt, /.well-known/ai-plugin.json and
# /.well-known/mcp.json. Permissive, because the site exists to be read.
[agents]
agents_txt = true
ai_plugin = true

[agents.mcp]
enabled = true

# Security headers for hosts that read `_headers`. GitHub Pages ignores the
# file; it is kept so the same build deploys elsewhere with the headers.
[edge_headers]
targets = ["netlify", "cloudflare"]
